name: MySQL Daily Backup

on:
  schedule:
    - cron: '0 18 * * *' # Chạy vào 1h sáng VN (18:00 UTC) hàng ngày
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install MySQL Client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Dump Database
        run: |
          mysqldump -h ${{ secrets.DB_HOST }} -u ${{ secrets.DB_USER }} -p"${{ secrets.DB_PASSWORD }}" -P ${{ secrets.DB_PORT }} ${{ secrets.DB_NAME }} > backup.sql
        
      - name: Compress Backup
        run: tar -cvzf backup-$(date +%Y-%m-%d).tar.gz backup.sql

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysql-backup-${{ github.run_id }}
          path: backup-*.tar.gz
          retention-days: 7 # Lưu giữ trong 7 ngày
