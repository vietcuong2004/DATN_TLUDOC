name: MySQL Daily Backup

on:
  schedule:
    - cron: '0 18 * * *' # 1h sáng VN
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install mysql2 dotenv --legacy-peer-deps # Bỏ qua xung đột peer deps của dự án chính

      - name: Run Backup Script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: node scripts/backup-db.mjs

      - name: Upload Backup to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysql-backup-${{ github.run_id }}
          path: backups/*.sql
          retention-days: 7
